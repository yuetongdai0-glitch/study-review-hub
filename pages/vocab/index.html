<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link data-study-hub-style rel="stylesheet" href="../../assets/hub-nav.css">
<title>测试</title>
<style>
  :root{
    --bg:#f2f3f6; --card:#fff; --ink:#1c2333; --ink2:#5a6478; --ink3:#8b93a5;
    --blue:#1f5fd6; --blue-soft:#e8f0fd;
    --green:#0f7a52; --green-soft:#e3f5ee;
    --amber:#9a6a12; --amber-soft:#fdf5e3;
    --red:#b8453c; --red-soft:#fdeeee;
    --violet:#6d43c8; --violet-soft:#efe9fc;
    --line:#e3e7f0; --line2:#eef1f6;
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.65;
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;}
  [hidden]{display:none !important;}

  /* ── 顶栏 ── */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(255,255,255,.95); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .topbar .row1{display:flex; align-items:baseline; gap:8px; max-width:820px; margin:0 auto;}
  .topbar h1{margin:0; font-size:17px; letter-spacing:-.2px; white-space:nowrap;}
  .topbar .stat{margin-left:auto; font-size:12.5px; color:var(--ink3); white-space:nowrap;}
  .topbar .sub{max-width:820px; margin:3px auto 0; font-size:12.5px; color:var(--ink3);}
  .searchwrap{max-width:820px; margin:9px auto 0; position:relative;}
  #q{
    width:100%; height:42px; padding:0 38px 0 36px;
    border:1px solid var(--line); border-radius:11px;
    background:#fbfcfe; font:inherit; font-size:14.5px; color:var(--ink); outline:none;
  }
  #q:focus{border-color:#9dbfef; background:#fff; box-shadow:0 0 0 3px var(--blue-soft);}
  .searchwrap .ico{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink3); font-size:14px;}
  .searchwrap .clr{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; color:var(--ink3); font-size:15px; line-height:1;
  }
  .searchwrap .clr:hover{background:var(--line2);}

  /* ── 快捷筛选 ── */
  .chips{display:flex; gap:7px; overflow-x:auto; padding:9px 0 1px; max-width:820px; margin:0 auto;
         -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chips button{
    flex:none; height:30px; padding:0 12px; border-radius:999px;
    border:1px solid var(--line); background:#fff; font-size:12.5px; color:var(--ink2); white-space:nowrap;
  }
  .chips button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff;}

  /* ── 主体 ── */
  main{max-width:820px; margin:0 auto; padding:14px 14px 0;}

  .group{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin-bottom:12px; overflow:hidden;}
  .group-head{
    display:flex; align-items:center; gap:9px; width:100%;
    padding:13px 14px; text-align:left;
  }
  .group-head:active{background:#fafbfd;}
  .group-head .tick{flex:none; width:8px; height:34px; border-radius:4px; background:var(--c, var(--blue));}
  .group-head .txt{flex:1 1 auto; min-width:0;}
  .group-head .txt b{display:block; font-size:15px; letter-spacing:-.1px;}
  .group-head .txt span{display:block; font-size:12px; color:var(--ink3); margin-top:1px;}
  .group-head .cnt{flex:none; font-size:12px; color:var(--ink3); font-variant-numeric:tabular-nums;}
  .group-head .caret{flex:none; color:var(--ink3); font-size:12px; transition:transform .18s ease;}
  .group[data-open="true"] .caret{transform:rotate(90deg);}
  .group-body{padding:0 14px 6px;}

  /* ── 词条 ── */
  .entry{border-top:1px solid var(--line2); padding:11px 0 12px;}
  .entry:first-child{border-top:0;}
  .entry-head{display:flex; align-items:baseline; gap:8px;}
  .entry-head b{font-size:15px; letter-spacing:-.1px;}
  .entry-head .copy{
    margin-left:auto; flex:none; height:26px; padding:0 9px; border-radius:8px;
    border:1px solid var(--line); background:#fff; font-size:11.5px; color:var(--ink3); white-space:nowrap;
  }
  .entry-head .copy:active{background:var(--line2);}
  .use{font-size:13px; color:var(--ink2); margin-top:3px;}
  .use em{font-style:normal; color:var(--ink3);}
  .eg{
    margin-top:7px; padding:8px 11px; border-radius:9px;
    background:#fafbfd; border-left:3px solid var(--c, var(--blue));
    font-size:13px; color:var(--ink2); line-height:1.7;
  }
  .eg b{color:var(--ink);}
  .tagline{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tag{
    font-size:12.5px; padding:4px 9px; border-radius:7px;
    background:var(--blue-soft); color:var(--blue); white-space:nowrap;
  }
  .tag.g{background:var(--green-soft); color:var(--green);}
  .tag.a{background:var(--amber-soft); color:var(--amber);}
  .tag.r{background:var(--red-soft); color:var(--red);}
  .tag.v{background:var(--violet-soft); color:var(--violet);}
  .tag b{font-weight:600;}

  /* 负面状态词表 */
  .suffix{display:grid; grid-template-columns:90px 1fr; gap:0; margin-top:6px;}
  .suffix > div{padding:7px 0; border-top:1px solid var(--line2); font-size:13.5px;}
  .suffix > div:nth-child(-n+2){border-top:0;}
  .suffix .k{color:var(--red); font-weight:600;}
  .suffix .v{color:var(--ink2);}

  .note{
    margin-top:9px; padding:9px 11px; border-radius:9px;
    background:var(--amber-soft); color:#7a530f; font-size:12.5px; line-height:1.7;
  }
  .note b{color:#5d3f08;}

  mark{background:#fff3b0; color:inherit; border-radius:3px; padding:0 1px;}

  .empty{text-align:center; color:var(--ink3); font-size:13.5px; padding:40px 0;}

  @media (min-width:761px){
    body{font-size:15.5px;}
    .topbar h1{font-size:18.5px;}
    .group-head .txt b{font-size:15.5px;}
    .entry-head b{font-size:15.5px;}
  }
  @media (max-width:400px){
    .suffix{grid-template-columns:76px 1fr;}
    .entry-head b{font-size:14.5px;}
  }
  @media print{
    .topbar,.chips,.copy,.study-hub-shell{display:none !important;}
    .group-body{display:block !important;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="row1">
    <h1>综应A 规范词速查</h1>
    <span class="stat" id="stat"></span>
  </div>
  <div class="sub">总括词／规范表达速查 · 点击词条可整条复制</div>
  <div class="searchwrap">
    <span class="ico" aria-hidden="true">⌕</span>
    <input id="q" type="search" placeholder="搜索：宣传 / 监管 / 队伍 / 应急 / 沟通…" autocomplete="off" aria-label="搜索规范词">
    <button class="clr" type="button" id="qclr" aria-label="清空" hidden>✕</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="题型筛选"></div>
</header>

<main id="main"></main>

<script data-study-hub-script src="../../assets/hub-nav.js"></script>

  var chipsEl = document.getElementById('chips');

  var openState = {};          /* 分组展开状态 */
  DATA.forEach(function (g) { openState[g.id] = true; });

  var filterGroup = '';        /* 当前题型筛选 */
  var keyword = '';

  /** HTML 转义，防止内容里的尖括号破坏结构。 */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /** 高亮关键词。 */
  function hl(s) {
    var t = esc(s);
    if (!keyword) return t;
    try {
      var re = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return t.replace(re, '<mark>$1</mark>');
    } catch (e) { return t; }
  }

  /** 判断一个词条是否命中筛选条件。 */
  function hit(texts) {
    if (!keyword) return true;
    var k = keyword.toLowerCase();
    return texts.some(function (x) { return String(x).toLowerCase().indexOf(k) >= 0; });
  }

  /** 渲染一个 entry 型分组。 */
  function renderEntries(g, items) {
    var h = '';
    items.forEach(function (it) {
      h += '<div class="entry">' +
             '<div class="entry-head"><b>' + hl(it.t) + '</b>' +
             '<button class="copy" type="button" data-copy="' + esc(it.t + '。' + (it.eg || '')) + '">复制</button></div>' +
             (it.use ? '<div class="use"><em>适用：</em>' + hl(it.use) + '</div>' : '') +
             (it.eg ? '<div class="eg">' + hl(it.eg) + '</div>' : '') +
           '</div>';
    });
    return h;
  }

  /** 渲染 suffix 型（负面状态词表）。 */
  function renderSuffix(items) {
    var h = '<div class="suffix">';
    items.forEach(function (it) {
      h += '<div class="k">' + hl(it.k) + '</div><div class="v">' + hl(it.v) + '</div>';
    });
    h += '</div>';
    return h;
  }

  /** 渲染 tag 型。 */
  function renderTags(tags) {
    var h = '<div class="tagline">';
    tags.forEach(function (t) {
      h += '<span class="tag ' + (t[2] || '') + '"><b>' + hl(t[0]) + '</b>：' + hl(t[1]) + '</span>';
    });
    h += '</div>';
    return h;
  }

  /** 主渲染。 */
  function render() {
    var html = '';
    var shown = 0, total = 0;

    DATA.forEach(function (g) {
      total += g.items ? g.items.length : (g.tags ? g.tags.length : 0);

      /* 按题型筛选 */
      if (filterGroup && g.id !== filterGroup) return;

      /* 按关键词过滤 */
      var items = g.items ? g.items.filter(function (it) {
        return hit([it.t || it.k, it.use, it.eg, it.v]);
      }) : null;
      var tags = g.tags ? g.tags.filter(function (t) { return hit([t[0], t[1]]); }) : null;
      var n = items ? items.length : (tags ? tags.length : 0);
      if (keyword && n === 0) return;
      shown += n;

      var body = '';
      if (g.kind === 'suffix') body = renderSuffix(items);
      else if (g.kind === 'tag') body = renderTags(tags);
      else body = renderEntries(g, items);

      /* 搜索时强制展开 */
      var open = keyword ? true : openState[g.id];
      html += '<section class="group" style="--c:' + g.color + '" data-g="' + g.id + '" data-open="' + open + '">' +
                '<button class="group-head" type="button" aria-expanded="' + open + '">' +
                  '<span class="tick" aria-hidden="true"></span>' +
                  '<span class="txt"><b>' + esc(g.title) + '</b><span>' + g.sub + '</span></span>' +
                  '<span class="cnt">' + n + '</span>' +
                  '<span class="caret" aria-hidden="true">▶</span>' +
                '</button>' +
                '<div class="group-body"' + (open ? '' : ' hidden') + '>' +
                  body +
                  (g.note ? '<div class="note">' + g.note + '</div>' : '') +
                '</div>' +
              '</section>';
    });

    mainEl.innerHTML = html || '<div class="empty">没有找到匹配的词条，换个关键词试试</div>';
    statEl.textContent = keyword || filterGroup
      ? '筛出 ' + shown + ' / ' + total + ' 条'
      : '共 ' + total + ' 条';
    clrEl.hidden = !keyword;
  }

  /* ============================================================
     交互
     ============================================================ */
  function showToast(msg) {
    var t = document.getElementById('__toast');
    if (!t) {
      t = document.createElement('div');
      t.id = '__toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:34px;transform:translate(-50%,10px);z-index:99;' +
        'max-width:84vw;padding:10px 16px;border-radius:11px;background:#101a2e;color:#fff;font-size:13.5px;' +
        'text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;' +
        'box-shadow:0 10px 26px rgba(16,24,40,.3);';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(function () { t.style.opacity = '1'; t.style.transform = 'translate(-50%,0)'; });
    clearTimeout(t.__t);
    t.__t = setTimeout(function () { t.style.opacity = '0'; t.style.transform = 'translate(-50%,10px)'; }, 1900);
  }

  /**
   * 复制文本。优先 Clipboard API，失败时回退到隐藏 textarea。
   * @param {string} text 待复制内容。
   * @returns {Promise<boolean>} 是否成功。
   */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; })
        .catch(function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  /* 折叠 / 展开 */
  mainEl.addEventListener('click', function (e) {
    var copyBtn = e.target.closest('.copy');
    if (copyBtn) {
      e.stopPropagation();
      copyText(copyBtn.dataset.copy).then(function (ok) {
        showToast(ok ? '已复制：' + copyBtn.dataset.copy.slice(0, 16) + '…' : '复制失败，请手动选中');
      });
      return;
    }
    var head = e.target.closest('.group-head');
    if (!head) return;
    var g = head.closest('.group');
    var id = g.dataset.g;
    var now = g.dataset.open !== 'true';
    g.dataset.open = String(now);
    head.setAttribute('aria-expanded', String(now));
    g.querySelector('.group-body').hidden = !now;
    openState[id] = now;
  });

  /* 搜索 */
  var timer = null;
  qEl.addEventListener('input', function () {
    keyword = qEl.value.trim();
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  });
  clrEl.addEventListener('click', function () {
    qEl.value = ''; keyword = ''; qEl.focus(); render();
  });
  qEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { qEl.value = ''; keyword = ''; render(); }
  });

  /* 快捷筛选 chips */
  var chips = [['', '全部']].concat(DATA.map(function (g) {
    return [g.id, g.title.replace(/^[一二三四五六七]、/, '').split('·')[0].trim()];
  }));
  chipsEl.innerHTML = chips.map(function (c) {
    return '<button type="button" data-g="' + c[0] + '" aria-pressed="' + (c[0] === '' ? 'true' : 'false') + '">' + esc(c[1]) + '</button>';
  }).join('');
  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-g]');
    if (!b) return;
    filterGroup = b.dataset.g;
    Array.prototype.forEach.call(chipsEl.children, function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  });

  render();
})();
</script>
</body>
</html>
