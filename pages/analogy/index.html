<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link data-study-hub-style rel="stylesheet" href="../../assets/hub-nav.css">
<title>测试</title>
<style>
  :root{
    --bg:#f2f3f6; --card:#fff; --ink:#1c2333; --ink2:#5a6478; --ink3:#8b93a5;
    --blue:#1f5fd6; --blue-soft:#e8f0fd;
    --green:#1e8449; --green-soft:#e6f4ec;
    --amber:#9a6a12; --amber-soft:#fdf5e3;
    --red:#b8453c; --red-soft:#fdeeee;
    --violet:#6d43c8; --violet-soft:#efe9fc;
    --line:#e3e7f0; --line2:#eef1f6;
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.65;
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;}
  [hidden]{display:none !important;}
  a{color:var(--blue);}

  /* ── 顶栏 ── */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(255,255,255,.95); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .topbar .row1{display:flex; align-items:baseline; gap:8px; max-width:860px; margin:0 auto;}
  .topbar h1{margin:0; font-size:17px; letter-spacing:-.2px; white-space:nowrap;}
  .topbar .stat{margin-left:auto; font-size:12.5px; color:var(--ink3); white-space:nowrap;}
  .topbar .sub{max-width:860px; margin:3px auto 0; font-size:12.5px; color:var(--ink3);}
  .searchwrap{max-width:860px; margin:9px auto 0; position:relative;}
  #q{
    width:100%; height:42px; padding:0 38px 0 36px;
    border:1px solid var(--line); border-radius:11px;
    background:#fbfcfe; font:inherit; font-size:14.5px; color:var(--ink); outline:none;
  }
  #q:focus{border-color:#9dbfef; background:#fff; box-shadow:0 0 0 3px var(--blue-soft);}
  .searchwrap .ico{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink3); font-size:14px;}
  .searchwrap .clr{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; color:var(--ink3); font-size:15px; line-height:1;
  }
  .searchwrap .clr:hover{background:var(--line2);}
  .chips{display:flex; gap:7px; overflow-x:auto; padding:9px 0 1px; max-width:860px; margin:0 auto;
         -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chips button{
    flex:none; height:36px; padding:0 14px; border-radius:999px;
    border:1px solid var(--line); background:#fff; font-size:12.5px; color:var(--ink2); white-space:nowrap;
  }
  .chips button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff;}

  /* ── 主体 ── */
  main{max-width:860px; margin:0 auto; padding:14px 14px 0;}

  /* 顶部速览 */
  .hero{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:15px 16px; margin-bottom:12px;
  }
  .hero h2{margin:0 0 4px; font-size:16px;}
  .hero .src{font-size:12px; color:var(--ink3); margin-bottom:9px;}
  .hero .three{display:grid; grid-template-columns:1fr; gap:8px; margin-top:10px;}
  .hero .three > div{background:var(--green-soft); border-radius:10px; padding:9px 12px; font-size:13.5px;}
  .hero .three b{color:var(--green);}
  .hero .tip{margin-top:10px; font-size:12.5px; color:var(--ink2); line-height:1.7;}

  .group{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin-bottom:12px; overflow:hidden;}
  .group-head{display:flex; align-items:center; gap:9px; width:100%; padding:13px 14px; text-align:left;}
  .group-head:active{background:#fafbfd;}
  .group-head .tick{flex:none; width:8px; height:34px; border-radius:4px; background:var(--c, var(--green));}
  .group-head .txt{flex:1 1 auto; min-width:0;}
  .group-head .txt b{display:block; font-size:15px; letter-spacing:-.1px;}
  .group-head .txt span{display:block; font-size:12px; color:var(--ink3); margin-top:1px;}
  .group-head .cnt{flex:none; font-size:12px; color:var(--ink3); font-variant-numeric:tabular-nums;}
  .group-head .caret{flex:none; color:var(--ink3); font-size:12px; transition:transform .18s ease;}
  .group[data-open="true"] .caret{transform:rotate(90deg);}
  .group-body{padding:0 14px 8px;}

  /* ── 知识点条目 ── */
  .entry{border-top:1px solid var(--line2); padding:12px 0 13px;}
  .entry:first-child{border-top:0;}
  .entry-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .entry-head b{font-size:15px; letter-spacing:-.1px;}
  .entry-head .badge{
    font-size:11.5px; padding:2px 7px; border-radius:6px;
    background:var(--amber-soft); color:var(--amber); font-weight:400;
  }
  .entry-head .badge.must{background:#fdeaea; color:var(--red);}
  .entry-head .badge.freq{background:var(--blue-soft); color:var(--blue);}
  .std{font-size:13.5px; color:var(--ink2); margin-top:4px;}
  .std em{font-style:normal; color:var(--ink3);}
  .std b{color:var(--ink);}
  .sub2{margin-top:8px;}
  .sub2 .t{font-size:12.5px; color:var(--green); font-weight:600; margin-bottom:3px;}
  .sub2 ul{margin:0; padding-left:17px; font-size:13px; color:var(--ink2); line-height:1.75;}
  .sub2 li{margin:2px 0;}
  .sub2 li b{color:var(--ink);}
  .eg{margin-top:9px; font-size:13px; color:var(--ink2); line-height:1.75;}
  .eg .lbl{color:var(--green); font-weight:600;}
  .kw{color:var(--red); font-weight:600;}

  .note{
    margin-top:10px; padding:9px 12px; border-radius:9px;
    background:var(--amber-soft); color:#7a530f; font-size:12.5px; line-height:1.75;
  }
  .note b{color:#5d3f08;}
  .note.green{background:var(--green-soft); color:#0f5c33;}
  .note.green b{color:#0b4527;}

  mark{background:#fff3b0; color:inherit; border-radius:3px; padding:0 1px;}
  .empty{text-align:center; color:var(--ink3); font-size:13.5px; padding:40px 0;}

  /* 原笔记整页 */
  .pages .pg{border-top:1px solid var(--line2); padding:12px 0;}
  .pages .pg:first-child{border-top:0;}
  .pages .pg p{margin:0 0 8px; font-size:13px; color:var(--ink2);}

  @media (min-width:761px){
    body{font-size:15.5px;}
    .topbar h1{font-size:18.5px;}
    .hero .three{grid-template-columns:repeat(3,1fr);}
    .entry-head b{font-size:15.5px;}
  }
  @media (max-width:400px){
    .hero{padding:13px 13px;}
    .entry-head b{font-size:14.5px;}
  }
  @media print{
    .topbar,.chips,.study-hub-shell{display:none !important;}
    .group-body{display:block !important;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="row1">
    <h1>类比推理 · 考点体系</h1>
    <span class="stat" id="stat"></span>
  </div>
  <div class="sub">核心原则 · 逻辑关系 8 类 · 经验常识 8 类 · 言语关系 · 造句法 ｜ 整理自程意《26 超格类比推理 7 页纸》，全部转为文字</div>
  <div class="searchwrap">
    <span class="ico" aria-hidden="true">⌕</span>
    <input id="q" type="search" placeholder="搜索：种属 / 因果 / 功能 / 命名 / 造句…" autocomplete="off" aria-label="搜索考点">
    <button class="clr" type="button" id="qclr" aria-label="清空" hidden>✕</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="板块筛选"></div>
</header>

<main id="main"></main>


<script data-study-hub-script src="../../assets/hub-nav.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     数据：按板块分组
     内容整理自《程意丨26超格类比推理7页纸》，重新组织为网页结构
     ============================================================ */
  var DATA = [
    {
      id:'principle', color:'var(--green)', title:'核心原则', sub:'3 条 · 做题前先记住',
      entries:[
        { t:'① 常态思维', std:'不要考虑极端情况，<b>按常态思维做题就行</b>。',
          eg:'<span class="lbl">例</span> 考"苹果 : 水果"这种常识关系时，不要去纠结"苹果也可以是品牌名"这类极端理解。' },
        { t:'② 先横后纵', std:'先看<b>横向</b>（题干之间）的关系；横向找不出答案时，再对比<b>纵向</b>（题干与选项）。',
          eg:'<span class="lbl">用法</span> 题干"西瓜 : 水果"先定横向是种属关系，再去选项里找同为种属关系的一项；若多项都符合，再用纵向词性/色彩区分。' },
        { t:'③ 先整体后局部', std:'先将题干<b>冒号前和冒号后</b>分别当成不同主体进行对比、观察关系；如果无法得出答案，<b>再拆开看</b>。',
          eg:'<span class="lbl">例</span> "铁路 : 公路"先整体看（并列）；整体无解时，再把"铁/公"这类字拆开比。' }
      ]
    },
    {
      id:'logic', color:'var(--blue)', title:'一、逻辑关系（8 类）', sub:'类比推理的主干考点 · 必背',
      entries:[
        { t:'1. 全同关系', badge:'必背',
          std:'<em>判断标准：</em>两个概念<b>完全相同</b>（同一个事物的不同叫法）。',
          eg:'<span class="lbl">示例</span> 麦克风 : 话筒　西红柿 : 番茄　纸鸢 : 风筝　芝麻 : 脂麻（脂麻即芝麻，又称胡麻、油麻）',
          subs:[
            { t:'★ 全同关系积累（背下来）', li:[
              '<b>属相 : 生肖</b>　｜　<b>刘彻 : 汉武帝</b>　｜　<b>引擎 : 发动机</b>　｜　<b>分母 : 除数</b>',
              '<b>岳父 : 泰山</b>　｜　<b>银杏 : 公孙木</b>　｜　<b>江南话 : 江浙话</b>　｜　<b>西红柿 : 番茄</b>',
              '<b>镇江 : 京口</b>　｜　<b>杜鹃花 : 映山红</b>　｜　<b>牙婆 : 人贩子</b>　｜　<b>生日 : 生辰</b>',
              '<b>牵牛花 : 喇叭花</b>　｜　<b>乞巧节 : 七夕节</b>　｜　<b>合肥 : 庐州</b>　｜　<b>荷花 : 芙蕖 / 菡萏</b>',
              '<b>矮瓜 : 茄子</b>　｜　<b>犬子 : 儿子</b>　｜　<b>芝麻 : 脂麻</b>　｜　<b>南京 : 金陵</b>',
              '<b>地瓜 : 甘薯</b>　｜　<b>考拉 : 树袋熊</b>　｜　<b>朱棣 : 明成祖</b>　｜　<b>桂 : 广西</b>',
              '<b>纸鸢 : 风筝</b>　｜　<b>赵匡胤 : 宋太祖</b>　｜　<b>成都 : 蓉城</b>　｜　<b>百分比 : 百分率</b>',
              '<b>广州 : 羊城</b>　｜　<b>马达 : 发动机</b>　｜　<b>益母草 : 红花艾</b>　｜　<b>夜宵 : 宵夜</b>',
              '<span class="kw">规律：地名别称、历史人物庙号本名、学名俗名、外来语音译，都是高频全同。</span>'
            ]}
          ] },

        { t:'2. 全异关系', badge:'必背',
          std:'<em>判断标准：</em>针对<b>同一类事物</b>的分类，两个概念<b>没有交集</b>。',
          eg:'<span class="lbl">示例</span> 成年人 : 未成年人　香蕉 : 苹果　吸尘器 : 加湿器　土豆 : 香菜',
          subs:[
            { t:'二级辨析', li:[
              '<b>(1) 矛盾全异</b>：只有两种情况（生:死、男:女、成年人:未成年人、金属:非金属）',
              '<b>(2) 反对全异</b>：有第 3 种情况（细菌:真菌、蛾眉月:下弦月）',
              '<b>(3) 是否有顺序</b>：是否紧密衔接（锁骨:肋骨:坐骨）',
              '<b>(4) 不同层级全异</b>：青蛙:哺乳动物（青蛙是两栖动物，与哺乳动物同层）',
              '<b>(5) 动力来源</b>：飞机:汽车:高铁:有轨电车（动力来源于"非人力"）',
              '<b>(6) 概念之间存在的转化</b>：孙子:父亲:祖父、昨天:今天:明天（同一主体的不同阶段）'
            ]},
          ],
          note:'★ 矛盾全异积累（按类别背）：<b>【是和非】</b>合法收入 : 非法收入、金属 : 非金属　｜　<b>【有和无】</b>有形损耗 : 无形损耗　｜　<b>【硬和软】</b>软实力 : 硬实力、软件 : 硬件　｜　<b>【阴和阳】</b>阴 : 阳、阴离子 : 阳离子　｜　<b>【真和假】</b>真 : 伪、真分数 : 假分数、有理数 : 无理数　｜　<b>【单字】</b>曲 : 直、动 : 静、生 : 死、男 : 女、合法行为 : 非法行为' },

        { t:'3. 种属关系', badge:'必背',
          std:'<em>含义：</em>一个小概念<b>完全属于</b>另一个大概念。<br><em>判断标准：</em>A 是 B（的一种 / 个）。',
          eg:'<span class="lbl">示例</span> 狗 : 动物　劳动者 : 工人:瓦工　车 : 机动车:货车',
          subs:[
            { t:'二级辨析', li:[
              '<b>(1) 小概念为泛指 / 特指</b>：长白山:火山、巢湖:淡水湖（特指——一说长白山就知道是哪里）；皇陵:古建筑（泛指——皇陵太多了，不知道是具体哪一个）。<br><span style="color:var(--red)">常见特指概念：山名、河流名、名人、名胜古迹、地名、国名</span>',
              '<b>(2) 叠加修饰词</b>：制造:中国制造:智能化中国制造；批评:自我批评:剖析式自我批评'
            ]},
          ]},

        { t:'4. 交叉关系', badge:'常考',
          std:'<em>判断标准：</em>两个概念<b>有交集</b>（画成两个相交的圆圈）。',
          eg:'<span class="lbl">示例</span> 布鞋 : 童鞋　护士 : 男护士',
          subs:[
            { t:'初步识别', li:[
              '<b>(1) 尾缀相同，从不同角度描述</b>：酒杯:玻璃杯（功能:材质）、素菜:热菜、童鞋:布鞋、铁皮桶:油桶',
              '<b>(2) 人的身份</b>：编剧:博士、专家:教授:博士、学生:顾客',
              '<b>(3) 两个概念词，不是之前的几种关系</b>：果汁:冷饮、瓷器:茶杯、金饰:手镯、上市企业:大型企业:民营企业、蛋糕:礼物'
            ]},
          ]},

        { t:'5. 顺承关系', badge:'常考',
          std:'<em>判断标准：</em>出现<b>多个有顺序的行为</b>（有先后顺序）。',
          eg:'<span class="lbl">示例</span> 提交:审核:批准　群众来访:窗口接访:调查督办　建造堤坝:潮汐发电:送电入户',
          subs:[
            { t:'二级辨析', li:[
              '<b>(1) 主体是否一致</b>：学习菜谱:下厨烹饪:总结经验（主体一致）；投稿稿件:编辑排版:读者阅读（主体不同）；通过安检:车站候车:登上列车（主体一致）；发布公告:制作标书:签订合同（主体不同）',
              '<b>(2) 事情是否圆满结束</b>：预约:核实:兑换　设想:实践:总结'
            ]},
          ]},

        { t:'6. 因果关系', badge:'必背',
          std:'<em>判断标准：</em>能用<b>"导致""所以"</b>造句。',
          subs:[
            { t:'分类', li:[
              '<b>(1) 普通因果</b>：下雨:地湿、发炎:发烧',
              '<b>(2) 连锁因果</b>：饮酒:神志不清:车祸',
              '<b>(3) 多因一果</b>：工业排放:滥用农药:水质污染；放养过密:喂饲不当:鱼病；发生地基下沉:结构老化:房屋倾斜'
            ]},
            { t:'二级辨析', li:[
              '<b>(1) 原因是人为 / 天然因素</b>：温室效应:冰川融化:海面上升、连日降雪:道路结冰:出行困难',
              '<b>(2) 结果是必然发生</b>：摩擦物体:产生热量、嗜烟酗酒:损害健康、春天播种:秋天收获、刻苦勤奋:成绩优秀 → 结果<b>必然</b>发生；认识错误:改正缺 → 结果<b>非必然</b>'
            ]},
          ]},

        { t:'7. 目的关系', badge:'常考',
          std:'<em>判断标准：</em>出现明显的<b>目的</b>，能用<b>"为了"</b>造句。',
          eg:'<span class="lbl">示例</span> 低碳排放:保护环境　收集数据:调查研究　轮作休耕:耕地保护:严禁占用　植树造林:碳中和:节能减排<br><span class="kw">注：政府提倡的行为，多考目的关系</span>',
          subs:[ { t:'二级辨析', li:['<b>目的能否实现</b>：刻舟:求剑缘木（目的不可实现）；围魏:救赵（目的可实现）'] } ] },

        { t:'8. 条件关系', badge:'必背',
          std:'<em>含义：</em>① <b>充分条件</b>——有它就行（有 A 一定有 B）；② <b>必要条件</b>——没它不行（没 A 一定没 B）。',
          eg:'<span class="lbl">示例</span> 氧气:生命 → 氧气是"必要条件"，生命是"充分条件"',
          subs:[
            { t:'常见考察形式', li:[
              '<b>(1) 成语俗语</b><br>充分条件：A 必/则/就/便 B —— 水至清则无鱼、受人滴水之恩:必当涌泉相报、小不忍:则乱大谋、锲而不舍:朽木不折<br>必要条件：不 A，不 B；A，才 B —— 不入虎穴:焉得虎子、无风:不起浪知、己知彼:百战百胜、不经一事:不长一智',
              '<b>(2) 日常生活事件</b>：水:生命、空气:人（前者是后者的必要条件）；考试:试题、拔罐:杯罐（前者是后者的充分条件）'
            ]},
          ]},
      ]
    },
    {
      id:'common', color:'var(--violet)', title:'二、经验常识（8 类）', sub:'结合生活常识考查 · 需边做题边积累',
      entries:[
        { t:'1. 功能关系', badge:'必背',
          std:'<em>判断标准：</em>工具及其功能用途。',

  var mainEl = document.getElementById('main');

  var openState = {};
  DATA.forEach(function (g) { openState[g.id] = true; });
  var filterGroup = '';
  var keyword = '';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&(?!(amp|lt|gt|quot|nbsp|#\d+);)/g, '&amp;')
      .replace(/<(?!\/?(b|br|em|u|span|i)\b)/g, '&lt;');
  }
  function hl(s) {
    var t = esc(s);
    if (!keyword) return t;
    try {
      var re = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return t.replace(re, '<mark>$1</mark>');
    } catch (e) { return t; }
  }
  /** 词条文本（用于搜索，去掉标签） */
  function flat(e) {
    var arr = [e.t, e.std];
    (e.subs || []).forEach(function (s) { arr.push(s.t); (s.li || []).forEach(function (x) { arr.push(x); }); });
    if (e.eg) arr.push(e.eg);
    return arr.join(' ').replace(/<[^>]+>/g, '');
  }
  function hit(arr) {
    if (!keyword) return true;
    var k = keyword.toLowerCase();
    return arr.some(function (x) { return String(x || '').toLowerCase().indexOf(k) >= 0; });
  }

  function renderEntry(e) {
    var h = '<div class="entry">';
    h += '<div class="entry-head"><b>' + hl(e.t) + '</b>' +
         (e.badge ? '<span class="badge ' + (e.badge === '必背' ? 'must' : e.badge === '常考' ? 'freq' : '') + '">' + esc(e.badge) + '</span>' : '') +
         '</div>';
    if (e.std) h += '<div class="std">' + hl(e.std) + '</div>';
    (e.subs || []).forEach(function (s) {
      h += '<div class="sub2">' + (s.t ? '<div class="t">' + hl(s.t) + '</div>' : '') + '<ul>';
      (s.li || []).forEach(function (x) { h += '<li>' + hl(x) + '</li>'; });
      h += '</ul></div>';
    });
    if (e.eg) h += '<div class="eg">' + hl(e.eg) + '</div>';
    h += '</div>';
    return h;
  }

  function render() {
    var html = '', shown = 0, total = 0;

    /* 顶部速览只在无筛选/无搜索时出现 */
    if (!keyword && !filterGroup) {
      html += '<section class="hero">' +
        '<h2>先记住这 3 条，再开始刷题</h2>' +
        '<div class="src">内容整理自《程意 · 26 超格类比推理 7 页纸》 · 考点与常识积累均已转为文字，便于搜索与背诵</div>' +
        '<div class="three">' +
          '<div><b>① 常态思维</b><br>不考虑极端情况</div>' +
          '<div><b>② 先横后纵</b><br>先看题干之间，再看题干与选项</div>' +
          '<div><b>③ 先整体后局部</b><br>先当两个主体比，实在不行再拆字</div>' +
        '</div>' +
        '<div class="tip">题目短小易读、做得快，但<b>考点碎、常结合常识</b>，实际难度不低。突破要点：① 明确做题核心原则；② 弱化主观想法，强化常考考点的记忆与使用；③ 边做题边积累常识。</div>' +
      '</section>';
    }

    DATA.forEach(function (g) {
      var n;
      total += g.entries.length;
      if (filterGroup && filterGroup !== g.id) return;
      var items = g.entries.filter(function (e) { return hit([flat(e)]); });
      if (keyword && items.length === 0) return;
      shown += items.length;

      var body = items.map(renderEntry).join('');
      var open = keyword ? true : openState[g.id];
      html += '<section class="group" style="--c:' + g.color + '" data-g="' + g.id + '" data-open="' + open + '">' +
        '<button class="group-head" type="button" aria-expanded="' + open + '">' +
          '<span class="tick" aria-hidden="true"></span>' +
          '<span class="txt"><b>' + esc(g.title) + '</b><span>' + esc(g.sub) + '</span></span>' +
          '<span class="cnt">' + items.length + '</span><span class="caret" aria-hidden="true">▶</span>' +
        '</button><div class="group-body"' + (open ? '' : ' hidden') + '>' + body + '</div></section>';
    });

    mainEl.innerHTML = html || '<div class="empty">没有找到匹配的考点，换个关键词试试</div>';
    statEl.textContent = (keyword || filterGroup) ? ('筛出 ' + shown + ' / ' + total + ' 条') : ('共 ' + total + ' 个考点');
    clrEl.hidden = !keyword;
  }

  /* ============================================================
     交互
     ============================================================ */
  mainEl.addEventListener('click', function (e) {
    var head = e.target.closest('.group-head');
    if (!head) return;
    var g = head.closest('.group');
    var now = g.dataset.open !== 'true';
    g.dataset.open = String(now);
    head.setAttribute('aria-expanded', String(now));
    g.querySelector('.group-body').hidden = !now;
    openState[g.dataset.g] = now;
  });

  /* 搜索 */
  var timer = null;
  qEl.addEventListener('input', function () {
    keyword = qEl.value.trim();
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  });
  clrEl.addEventListener('click', function () { qEl.value = ''; keyword = ''; qEl.focus(); render(); });
  qEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { qEl.value = ''; keyword = ''; render(); }
  });

  /* 板块筛选 */
  var chips = [['', '全部']].concat(DATA.map(function (g) {
    return [g.id, g.title.replace(/^[一二三四]、/, '').replace(/^附：/, '').split('（')[0].trim()];
  }));
  chipsEl.innerHTML = chips.map(function (c) {
    return '<button type="button" data-g="' + c[0] + '" aria-pressed="' + (c[0] === '' ? 'true' : 'false') + '">' + esc(c[1]) + '</button>';
  }).join('');
  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-g]');
    if (!b) return;
    filterGroup = b.dataset.g;
    Array.prototype.forEach.call(chipsEl.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  });

  render();
})();
</script>
</body>
</html>
