<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link data-study-hub-style rel="stylesheet" href="../../assets/hub-nav.css">
<title>测试</title>
<style>
  :root{
    --bg:#eef1f6; --surface:#fff; --ink:#17191d; --ink2:#5a6478; --muted:#8b93a3;
    --line:#e3e7f0; --blue:#1f5fd6; --blue-soft:#eaf0fd;
    --red:#c0392b; --red-soft:#fdecea;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 30px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
    overscroll-behavior:none; -webkit-text-size-adjust:100%;
  }
  button,select,input{font:inherit; color:inherit;}
  button{cursor:pointer;}

  .app{height:100vh; height:100dvh; display:flex; flex-direction:column; min-height:0;}

  /* ===== 顶栏 ===== */
  .topbar{
    flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:9px 16px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .back{
    flex:none; width:30px; height:30px; display:grid; place-items:center;
    border:1px solid var(--line); border-radius:8px; background:#fff;
    color:var(--ink2); text-decoration:none; font-size:15px; line-height:1;
  }
  .back:hover,.back:focus-visible{border-color:#c3d2ee; color:var(--blue);}
  .topbar h1{font-size:16px; font-weight:700; letter-spacing:.2px; white-space:nowrap;}
  .sub{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar-right{display:flex; align-items:center; gap:8px; flex:none; min-width:0;}
  .status{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw;}

  /* ===== 工具栏 ===== */
  .toolbar{
    flex:none; display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px;
    padding:9px 16px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .group{display:flex; align-items:center; gap:6px; flex:none;}
  .divider{width:1px; height:20px; background:var(--line); flex:none;}
  .seg, .icon-btn, .primary{
    height:32px; padding:0 11px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--ink2); font-size:12.5px; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; gap:4px;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .seg:hover, .icon-btn:hover, .seg:focus-visible, .icon-btn:focus-visible{border-color:#c3d2ee; color:var(--blue);}
  .seg.is-on{background:var(--blue-soft); border-color:#bcd0f4; color:var(--blue); font-weight:600;}
  .icon-btn[disabled]{opacity:.42; cursor:not-allowed;}
  .icon-btn[disabled]:hover{border-color:var(--line); color:var(--ink2);}
  .icon-btn.danger:hover:not([disabled]){border-color:#f0c2bb; color:var(--red); background:var(--red-soft);}
  .primary{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
  .primary:hover{background:#1a53bd; border-color:#1a53bd; color:#fff;}

  .dot{
    position:relative; width:24px; height:24px; padding:0; border-radius:50%;
    border:1px solid rgba(15,23,42,.14); background:var(--c); flex:none;
  }
  .dot::after{
    content:""; position:absolute; inset:-4px; border-radius:50%;
    border:2px solid transparent; transition:border-color .15s ease;
  }
  .dot.is-on::after{border-color:var(--blue);}
  .dot:hover::after{border-color:#b9c8e4;}
  .dot-custom{
    background:conic-gradient(#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7,#ef4444);
    overflow:hidden;
  }
  .dot-custom input{position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; padding:0; cursor:pointer;}

  .lbl{font-size:12px; color:var(--muted); flex:none;}
  input[type="range"]{
    width:104px; height:22px; accent-color:var(--blue); background:transparent; cursor:pointer; flex:none;
  }
  #sizeOut{
    min-width:22px; text-align:center; font-size:12px; color:var(--ink2);
    font-variant-numeric:tabular-nums;
  }
  select{
    height:32px; padding:0 8px; border:1px solid var(--line); border-radius:8px;
    background:#fff; font-size:12.5px; color:var(--ink2); cursor:pointer;
  }
  select:hover,select:focus-visible{border-color:#c3d2ee; color:var(--blue); outline:none;}
  .actions{margin-left:auto;}

  /* ===== 画布 ===== */
  .stage{
    flex:1; min-height:0; display:flex; padding:12px 14px 10px;
  }
  .paper-wrap{
    position:relative; flex:1; min-width:0; min-height:0;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  .paper-wrap canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
  }
  #ink{touch-action:none; cursor:crosshair; z-index:1;}
  #ink[data-tool="eraser"]{cursor:none;}

  .hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; color:#a6aebd; font-size:13px; line-height:1.9;
    pointer-events:none; transition:opacity .35s ease; z-index:2;
  }
  .hint kbd{
    font-family:inherit; padding:1px 5px; margin:0 2px; border-radius:4px;
    background:#f2f4f9; border:1px solid #e3e7f0; color:#7c869a; font-size:11.5px;
  }
  .hint-touch{display:none;}

  .ring{
    position:absolute; z-index:3; border-radius:50%; border:1.5px solid rgba(60,70,90,.75);
    background:rgba(120,130,150,.10); transform:translate(-50%,-50%);
    pointer-events:none; display:none;
  }
  .ring:not([hidden]){display:block;}

  /* ===== 底栏 ===== */
  .footbar{
    flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:0 78px 10px 18px; min-height:38px; padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  .keys{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; color:var(--muted);}
  .keys b{font-weight:600; color:var(--ink2);}
  .counter{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}

  /* ===== 提示条 ===== */
  .toast{
    position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:60;
    transform:translate(-50%,10px); opacity:0; visibility:hidden;
    padding:8px 16px; border-radius:999px; background:rgba(23,25,29,.92); color:#fff;
    font-size:12.5px; white-space:nowrap; box-shadow:0 8px 24px rgba(15,23,42,.22);
    transition:opacity .18s ease, transform .18s ease, visibility .18s ease;
    max-width:calc(100vw - 40px); overflow:hidden; text-overflow:ellipsis;
  }
  .toast[data-open="true"]{opacity:1; transform:translate(-50%,0); visibility:visible;}

  /* ===== 自绘确认框（禁用原生 confirm） ===== */
  .modal{
    position:fixed; inset:0; z-index:80; display:grid; place-items:center;
    padding:24px; background:rgba(15,23,42,.34);
  }
  .modal[hidden]{display:none;}
  .modal-card{
    width:min(360px,100%); background:#fff; border-radius:12px; padding:20px;
    box-shadow:0 24px 60px rgba(15,23,42,.28);
  }
  .modal-card h2{font-size:15.5px; margin-bottom:8px;}
  .modal-card p{font-size:12.5px; color:var(--ink2); line-height:1.7;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .modal-actions .icon-btn{height:34px; padding:0 14px;}
  .modal-actions .danger{background:var(--red); border-color:var(--red); color:#fff; font-weight:600;}
  .modal-actions .danger:hover{background:#a93226; border-color:#a93226; color:#fff;}

  /* ===== 窄屏：工具栏排成两行，全部控件一眼可见，不做横向滚动 ===== */
  @media (max-width:720px){
    .topbar{padding:8px 12px;}
    .sub{display:none;}
    .toolbar{
      padding:8px 12px; gap:6px 7px; flex-wrap:wrap; overflow:visible;
      justify-content:flex-start;
    }
    .divider{display:none;}
    .lbl{display:none;}
    .seg,.icon-btn,.primary{height:30px; padding:0 9px; font-size:12px;}
    .dot{width:22px; height:22px;}
    .group{gap:5px;}
    input[type="range"]{width:62px;}
    #sizeOut{min-width:16px; font-size:11.5px;}
    select{height:30px; padding:0 4px; font-size:12px;}
    /* 纸张与动作按钮落在同一行：第一行放工具+配色+粗细，第二行放纸张+四个按钮 */
    .actions{flex:0 0 auto; margin-left:auto; gap:6px;}
    .stage{padding:8px 10px;}
    .footbar{padding:0 12px 8px; min-height:32px; padding-bottom:calc(8px + env(safe-area-inset-bottom));}
    .keys{display:none;}
    .counter{font-size:11px;}
    .hint-wide{display:none;}
    .hint-touch{display:inline;}
    .status{max-width:30vw;}
    .study-hub-shell{right:12px !important; bottom:calc(34px + env(safe-area-inset-bottom)) !important;}
    .study-hub-trigger{width:44px !important; height:44px !important;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <a class="back" href="../../index.html" aria-label="返回备考复习总览">←</a>
      <div>
        <h1>草稿纸</h1>
        <p class="sub">按住鼠标左键书写 · 橡皮局部擦除 · 自动保存</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="status" id="status"></span>
      <button type="button" id="full" class="icon-btn" title="全屏（F）">全屏</button>
    </div>
  </header>

  <div class="toolbar" role="toolbar" aria-label="草稿纸工具">
    <div class="group">
      <button type="button" id="tool-pen" class="seg is-on" data-tool="pen" title="画笔（B）" aria-pressed="true">笔</button>
      <button type="button" id="tool-eraser" class="seg" data-tool="eraser" title="橡皮（E）" aria-pressed="false">橡皮</button>
    </div>

    <span class="divider" aria-hidden="true"></span>

    <div class="group" id="swatches" role="group" aria-label="笔迹颜色">
      <button type="button" class="dot is-on" data-color="#1c2333" style="--c:#1c2333" title="黑色（1）" aria-label="黑色" aria-pressed="true"></button>
      <button type="button" class="dot" data-color="#1f5fd6" style="--c:#1f5fd6" title="蓝色（2）" aria-label="蓝色" aria-pressed="false"></button>
      <button type="button" class="dot" data-color="#c0392b" style="--c:#c0392b" title="红色（3）" aria-label="红色" aria-pressed="false"></button>
      <button type="button" class="dot" data-color="#0f6e56" style="--c:#0f6e56" title="绿色（4）" aria-label="绿色" aria-pressed="false"></button>
      <label class="dot dot-custom" title="自定义颜色">
        <input type="color" id="customColor" value="#7c3aed" aria-label="自定义笔迹颜色">
      </label>
    </div>

    <span class="divider" aria-hidden="true"></span>

    <div class="group">
      <label class="lbl" for="size">粗细</label>
      <input type="range" id="size" min="1" max="24" step="1" value="3">
      <output id="sizeOut" for="size">3</output>
    </div>

    <div class="group">
      <label class="lbl" for="paperType">纸张</label>
      <select id="paperType">
        <option value="none">空白</option>
        <option value="line">横线</option>
        <option value="grid">方格</option>
        <option value="dot">点阵</option>
      </select>
    </div>

    <div class="group actions">
      <button type="button" id="undo" class="icon-btn" title="撤销（Ctrl/⌘ + Z）" disabled>撤销</button>
      <button type="button" id="redo" class="icon-btn" title="重做（Ctrl/⌘ + Shift + Z）" disabled>重做</button>
      <button type="button" id="clear" class="icon-btn danger" title="清空整页">清空</button>
      <button type="button" id="save" class="primary" title="把当前草稿保存成 PNG 图片">保存图片</button>
    </div>
  </div>

  <main class="stage">
    <div class="paper-wrap" id="paperWrap">
      <canvas id="paper" aria-hidden="true"></canvas>
      <canvas id="ink" data-tool="pen" aria-label="草稿纸画布，按住即可书写"></canvas>
      <div class="hint" id="hint">
        <span class="hint-wide">按住鼠标左键（或手指）就能打草稿<br>写错了用 <kbd>橡皮</kbd> 擦，或者 <kbd>Ctrl/⌘ + Z</kbd> 撤销</span>
        <span class="hint-touch">单指按住就能打草稿<br>写错了切「橡皮」擦一擦</span>
      </div>
      <div class="ring" id="ring" hidden></div>
    </div>
  </main>

  <div class="footbar">
    <div class="keys" id="keys">
      <span><b>B</b> 笔</span>
      <span><b>E</b> 橡皮</span>
      <span><b>1–4</b> 换色</span>
      <span><b>Ctrl/⌘ Z</b> 撤销</span>
      <span><b>Ctrl/⌘ ⇧ Z</b> 重做</span>
      <span><b>F</b> 全屏</span>
    </div>
    <div class="counter" id="counter">0 笔</div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
    <h2 id="modalTitle">清空整页草稿？</h2>
    <p id="modalDesc">清空后仍然可以用「撤销」找回（最多 300 步），也可以先用「保存图片」留底。</p>
    <div class="modal-actions">
      <button type="button" class="icon-btn" id="modalCancel">取消</button>
      <button type="button" class="icon-btn danger" id="modalOk">清空</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict'

  var KEY = 'scratchpad:v1'
  var MAX_UNDO = 300
  var MAX_STROKES = 1200
  var MIN_DIST = 1.1

  var $ = function (id) { return document.getElementById(id) }
  var wrap = $('paperWrap')
  var paper = $('paper')
  var ink = $('ink')
  var pctx = paper.getContext('2d')
  var ictx = ink.getContext('2d')
  var hint = $('hint')
  var ring = $('ring')
  var statusEl = $('status')
  var counter = $('counter')
  var toastEl = $('toast')
  var modal = $('modal')

  var state = { tool: 'pen', color: '#1c2333', size: 3, paper: 'none' }
  var strokes = []
  var undoStack = []
  var redoStack = []
  var current = null
  var activeId = null
  var penActive = false
  var dpr = Math.min(window.devicePixelRatio || 1, 3)
  var w = 0
  var h = 0
  var saveTimer = 0
  var toastTimer = 0

  /* ============================================================
     画布尺寸与纸张
     ============================================================ */
  function fitCanvas() {
    var rect = wrap.getBoundingClientRect()
    var nextW = Math.max(1, Math.round(rect.width))
    var nextH = Math.max(1, Math.round(rect.height))
    var ratio = Math.min(window.devicePixelRatio || 1, 3)
    var changed = nextW !== w || nextH !== h || ratio !== dpr

    w = nextW
    h = nextH
    dpr = ratio
    if (!changed && ink.width === Math.round(w * dpr)) return false

    ;[paper, ink].forEach(function (cv) {
      cv.width = Math.round(w * dpr)
      cv.height = Math.round(h * dpr)
    })
    return true
  }

  function paintPaper() {
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    pctx.clearRect(0, 0, w, h)
    pctx.fillStyle = '#ffffff'
    pctx.fillRect(0, 0, w, h)
    if (state.paper === 'none') return

    var step = state.paper === 'dot' ? 26 : 30
    var x, y

    if (state.paper === 'line') {
      pctx.strokeStyle = '#e4ebf7'
      pctx.lineWidth = 1
      pctx.beginPath()
      for (y = step; y < h; y += step) {
        pctx.moveTo(0, Math.round(y) + 0.5)
        pctx.lineTo(w, Math.round(y) + 0.5)
      }
      pctx.stroke()
      return
    }

    if (state.paper === 'grid') {
      pctx.strokeStyle = '#e9eef8'
      pctx.lineWidth = 1
      pctx.beginPath()
      for (x = step; x < w; x += step) {
        pctx.moveTo(Math.round(x) + 0.5, 0)
        pctx.lineTo(Math.round(x) + 0.5, h)
      }
      for (y = step; y < h; y += step) {
        pctx.moveTo(0, Math.round(y) + 0.5)
        pctx.lineTo(w, Math.round(y) + 0.5)
      }
      pctx.stroke()
      return
    }

    // 点阵
    pctx.fillStyle = '#d9e2f3'
    for (x = step; x < w; x += step) {
      for (y = step; y < h; y += step) {
        pctx.beginPath()
        pctx.arc(x, y, 1.1, 0, Math.PI * 2)
        pctx.fill()
      }
    }
  }

  /* ============================================================
     笔迹绘制
     ============================================================ */
  function strokeStyle(ctx, s) {
    ctx.save()
    ctx.globalCompositeOperation = s.t === 'eraser' ? 'destination-out' : 'source-over'
    ctx.strokeStyle = s.c
    ctx.fillStyle = s.c
    ctx.lineWidth = s.w
    ctx.lineCap = 'round'
    ctx.lineJoin = 'round'
  }

  function drawStroke(ctx, s) {
    var p = s.p
    if (!p || p.length < 2) return
    strokeStyle(ctx, s)
    if (p.length === 2) {
      ctx.beginPath()
      ctx.arc(p[0], p[1], s.w / 2, 0, Math.PI * 2)
      ctx.fill()
    } else {
      ctx.beginPath()
      ctx.moveTo(p[0], p[1])
      for (var i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1])
      ctx.stroke()
    }
    ctx.restore()
  }

  function drawSegment(s, from) {
    var p = s.p
    if (p.length === 2) { drawStroke(ictx, s); return }
    strokeStyle(ictx, s)
    for (var i = Math.max(2, from | 0); i < p.length; i += 2) {
      ictx.beginPath()
      ictx.moveTo(p[i - 2], p[i - 1])
      ictx.lineTo(p[i], p[i + 1])
      ictx.stroke()
    }
    ictx.restore()
  }

  function redrawInk() {
    ictx.setTransform(1, 0, 0, 1, 0, 0)
    ictx.clearRect(0, 0, ink.width, ink.height)
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0)
    for (var i = 0; i < strokes.length; i++) drawStroke(ictx, strokes[i])
  }

  /* ============================================================
     撤销 / 重做（命令栈：加笔画 / 清空）
     ============================================================ */
  function pushUndo(cmd) {
    undoStack.push(cmd)
    if (undoStack.length > MAX_UNDO) undoStack.shift()
    redoStack.length = 0
    syncButtons()
    scheduleSave()
  }

  /**
   * 笔迹数超过上限时丢最旧的笔画，并同步丢掉撤销栈里对应的 add 记录，
   * 否则「撤销」会 pop 掉一条还在画面上的笔迹，画面与历史就此错位。
   */
  function trimStrokes() {
    if (strokes.length <= MAX_STROKES) return
    var drop = strokes.length - MAX_STROKES
    strokes.splice(0, drop)
    for (var i = 0; i < undoStack.length && drop > 0; i++) {
      if (undoStack[i].type === 'add') {
        undoStack.splice(i, 1)
        i--
        drop--
      }
    }
  }

  function undo() {
    if (!undoStack.length) return
    var cmd = undoStack.pop()
    if (cmd.type === 'add') {
      strokes.pop()
      redoStack.push({ type: 'add', s: cmd.s })
    } else {
      strokes = cmd.s.slice()
      redoStack.push({ type: 'clear', s: cmd.s })
    }
    redrawInk()
    syncButtons()
    scheduleSave()
  }

  function redo() {
    if (!redoStack.length) return
    var cmd = redoStack.pop()
    if (cmd.type === 'add') {
      strokes.push(cmd.s)
      undoStack.push({ type: 'add', s: cmd.s })
    } else {
      undoStack.push({ type: 'clear', s: strokes.slice() })
      strokes = []
    }
    redrawInk()
    syncButtons()
    scheduleSave()
  }

  function clearAll() {
    if (!strokes.length) { toast('已经是空白页了'); return }
    undoStack.push({ type: 'clear', s: strokes.slice() })
    if (undoStack.length > MAX_UNDO) undoStack.shift()
    redoStack.length = 0
    strokes = []
    redrawInk()
    syncButtons()
    scheduleSave()
    toast('已清空，可点「撤销」找回')
  }

  function syncButtons() {
    $('undo').disabled = undoStack.length === 0
    $('redo').disabled = redoStack.length === 0
    counter.textContent = strokes.length + ' 笔'
    hint.style.opacity = strokes.length ? '0' : '1'
    hint.style.visibility = strokes.length ? 'hidden' : 'visible'
  }

  /* ============================================================
     指针交互：只认鼠标左键 / 单指 / 手写笔
     ============================================================ */
  function pointOf(e) {
    var rect = ink.getBoundingClientRect()
    return [e.clientX - rect.left, e.clientY - rect.top]
  }

  /**
   * 橡皮直径独立于笔粗：细笔配橡皮不该只有几像素，
   * 太小的橡皮在手机上几乎擦不动，手感极差。
   */
  function eraserWidth() {
    return Math.max(16, state.size * 4)
  }

  function ringAt(e) {
    if (state.tool !== 'eraser' || e.pointerType === 'touch') { ring.hidden = true; return }
    var rect = wrap.getBoundingClientRect()
    var d = eraserWidth()
    ring.hidden = false
    ring.style.width = d + 'px'
    ring.style.height = d + 'px'
    ring.style.left = (e.clientX - rect.left) + 'px'
    ring.style.top = (e.clientY - rect.top) + 'px'
  }

  function onDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return
    if (activeId !== null) {
      // 手掌误触：手写笔正在书写时忽略手指
      if (penActive && e.pointerType === 'touch') return
      return
    }

    activeId = e.pointerId
    if (e.pointerType === 'pen') penActive = true

    var width = state.tool === 'eraser' ? eraserWidth() : state.size
    current = {
      t: state.tool,
      c: state.color,
      w: Math.max(1, width),
      p: []
    }
    var pt = pointOf(e)
    current.p.push(pt[0], pt[1])
    drawStroke(ictx, current)

    try { ink.setPointerCapture(e.pointerId) } catch (err) {}
    ringAt(e)
    if (e.pointerType !== 'mouse') e.preventDefault()
  }

  function onMove(e) {
    ringAt(e)
    if (!current || e.pointerId !== activeId) return

    var events = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : []
    if (!events.length) events = [e]

    var p = current.p
    var start = p.length
    for (var i = 0; i < events.length; i++) {
      var pt = pointOf(events[i])
      var lx = p[p.length - 2]
      var ly = p[p.length - 1]
      var dx = pt[0] - lx
      var dy = pt[1] - ly
      if (dx * dx + dy * dy < MIN_DIST * MIN_DIST) continue
      p.push(pt[0], pt[1])
    }

    if (p.length > start) drawSegment(current, start)
    if (e.cancelable && e.pointerType !== 'mouse') e.preventDefault()
  }

  function finishStroke(id, cancelled) {
    if (!current || id !== activeId) return
    var stroke = current
    current = null
    if (!cancelled && stroke.p.length >= 2) {
      strokes.push(stroke)
      pushUndo({ type: 'add', s: stroke })
      trimStrokes()
    } else {
      redrawInk()
    }
    syncButtons()
  }

  function onUp(e) {
    if (e.pointerId !== activeId) return
    finishStroke(e.pointerId, false)
    activeId = null
    penActive = false
    ring.hidden = true
    try { ink.releasePointerCapture(e.pointerId) } catch (err) {}
    scheduleSave()
  }

  function onCancel(e) {
    if (e.pointerId !== activeId) return
    finishStroke(e.pointerId, true)
    activeId = null
    penActive = false
    ring.hidden = true
  }

  ink.addEventListener('pointerdown', onDown)
  ink.addEventListener('pointermove', onMove)
  ink.addEventListener('pointerup', onUp)
  ink.addEventListener('pointercancel', onCancel)
  ink.addEventListener('pointerleave', function () { ring.hidden = true })
  ink.addEventListener('pointerenter', function (e) { if (state.tool === 'eraser') ringAt(e) })
  ink.addEventListener('contextmenu', function (e) { e.preventDefault() })

  /* ============================================================
     工具栏状态
     ============================================================ */
  function setTool(tool) {
    state.tool = tool
    ink.dataset.tool = tool
    $('tool-pen').classList.toggle('is-on', tool === 'pen')
    $('tool-eraser').classList.toggle('is-on', tool === 'eraser')
    $('tool-pen').setAttribute('aria-pressed', String(tool === 'pen'))
    $('tool-eraser').setAttribute('aria-pressed', String(tool === 'eraser'))
    ring.hidden = true
  }

  function setColor(color, custom) {
    state.color = color
    var dots = document.querySelectorAll('#swatches .dot[data-color]')
    for (var i = 0; i < dots.length; i++) {
      var on = !custom && dots[i].getAttribute('data-color') === color
      dots[i].classList.toggle('is-on', on)
      dots[i].setAttribute('aria-pressed', String(on))
    }
    if (custom) {
      document.querySelector('.dot-custom').classList.add('is-on')
      document.querySelector('.dot-custom').setAttribute('aria-pressed', 'true')
    } else {
      document.querySelector('.dot-custom').classList.remove('is-on')
      document.querySelector('.dot-custom').setAttribute('aria-pressed', 'false')
    }
    if (state.tool === 'eraser') setTool('pen')
  }

  function setSize(value) {
    state.size = Math.min(24, Math.max(1, Number(value) || 1))
    $('size').value = String(state.size)
    $('sizeOut').textContent = String(state.size)
  }

  function setPaper(value) {
    state.paper = ['none', 'line', 'grid', 'dot'].indexOf(value) >= 0 ? value : 'none'
    $('paperType').value = state.paper
    paintPaper()
    scheduleSave()
  }

  $('tool-pen').addEventListener('click', function () { setTool('pen') })
  $('tool-eraser').addEventListener('click', function () { setTool('eraser') })

  document.querySelectorAll('#swatches .dot[data-color]').forEach(function (dot) {
    dot.addEventListener('click', function () { setColor(dot.getAttribute('data-color'), false) })
  })
  $('customColor').addEventListener('input', function (e) { setColor(e.target.value, true) })

  $('size').addEventListener('input', function (e) { setSize(e.target.value) })
  $('paperType').addEventListener('change', function (e) { setPaper(e.target.value) })

  $('undo').addEventListener('click', undo)
  $('redo').addEventListener('click', redo)
  $('clear').addEventListener('click', function () {
    if (!strokes.length) { toast('已经是空白页了'); return }
    openModal()
  })

  /* ============================================================
     清空确认框（自绘，不用原生 confirm）
     ============================================================ */
  var lastFocus = null

  function openModal() {
    lastFocus = document.activeElement
    modal.hidden = false
    $('modalCancel').focus()
  }

  function closeModal() {
    modal.hidden = true
    if (lastFocus && lastFocus.focus) lastFocus.focus()
  }

  $('modalCancel').addEventListener('click', closeModal)
  $('modalOk').addEventListener('click', function () { closeModal(); clearAll() })
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal() })

  /* ============================================================
     提示条
     ============================================================ */
  function toast(message) {
    toastEl.textContent = message
    toastEl.dataset.open = 'true'
    clearTimeout(toastTimer)
    toastTimer = setTimeout(function () { toastEl.dataset.open = 'false' }, 2000)
  }

  function setStatus(message) {
    statusEl.textContent = message
  }

  /* ============================================================
     本地保存
     ============================================================ */
  /**
   * 序列化当前草稿。若点位过多导致体积超标，只对「存档副本」按 2 的幂抽稀，
   * 画面上的笔迹保持完整；抽稀时成对保留 x/y，不会把点打乱。
   */
  function payload() {
    var data = { v: 1, paper: state.paper, strokes: strokes, saved: Date.now() }
    var text = JSON.stringify(data)
    var step = 1
    while (text.length > 1800000 && step < 64) {
      step *= 2
      data.strokes = strokes.map(function (s) {
        if (s.p.length <= 4) return s
        var p = []
        for (var i = 0; i < s.p.length; i += 2 * step) p.push(s.p[i], s.p[i + 1])
        if (p.length <= 2) p.push(s.p[s.p.length - 2], s.p[s.p.length - 1])
        return { t: s.t, c: s.c, w: s.w, p: p }
      })
      text = JSON.stringify(data)
    }
    return text
  }

  function scheduleSave() {
    clearTimeout(saveTimer)
    saveTimer = setTimeout(save, 700)
  }

  function save() {
    clearTimeout(saveTimer)
    try {
      localStorage.setItem(KEY, payload())
      setStatus('已自动保存')
      return
    } catch (err) {
      // 存储超限：只留最近 60 笔重试一次（历史已不可靠，一并清掉避免撤销错位）
      if (strokes.length > 60) {
        strokes = strokes.slice(strokes.length - 60)
        undoStack.length = 0
        redoStack.length = 0
        redrawInk()
        syncButtons()
        try {
          localStorage.setItem(KEY, payload())
          setStatus('本地空间将满，已只保留最近笔迹')
          return
        } catch (err2) {}
      }
      setStatus('本地保存失败（空间不足）')
    }
  }

  function validStroke(s) {
    if (!s || (s.t !== 'pen' && s.t !== 'eraser')) return false
    if (typeof s.c !== 'string' || !s.c) return false
    if (typeof s.w !== 'number' || !isFinite(s.w) || s.w <= 0) return false
    if (!Array.isArray(s.p) || s.p.length < 2 || s.p.length % 2) return false
    for (var i = 0; i < s.p.length; i++) {
      if (typeof s.p[i] !== 'number' || !isFinite(s.p[i])) return false
    }
    return true
  }

  function restore() {
    var raw
    try { raw = localStorage.getItem(KEY) } catch (err) { return false }
    if (!raw) return false
    try {
      var data = JSON.parse(raw)
      if (!data || !Array.isArray(data.strokes)) return false
      strokes = data.strokes.filter(validStroke).slice(-MAX_STROKES)
      if (data.paper) state.paper = ['none', 'line', 'grid', 'dot'].indexOf(data.paper) >= 0 ? data.paper : 'none'
      return strokes.length > 0
    } catch (err) {
      return false
    }
  }

  /* ============================================================
     保存图片
     ============================================================ */
  function stamp() {
    var d = new Date()
    var pad = function (n) { return n < 10 ? '0' + n : String(n) }
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes())
  }

  function exportPng() {
    if (!w || !h) { toast('画布还没准备好'); return }
    var out = document.createElement('canvas')
    out.width = paper.width
    out.height = paper.height
    var ctx = out.getContext('2d')
    ctx.drawImage(paper, 0, 0)
    ctx.drawImage(ink, 0, 0)

    var name = '草稿纸-' + stamp() + '.png'
    try {
      out.toBlob(function (blob) {
        if (!blob) { toast('导出失败，请重试'); return }
        var url = URL.createObjectURL(blob)
        var a = document.createElement('a')
        a.href = url
        a.download = name
        document.body.appendChild(a)
        a.click()
        a.remove()
        setTimeout(function () { URL.revokeObjectURL(url) }, 5000)
        toast('已保存：' + name)
      }, 'image/png')
    } catch (err) {
      toast('导出失败，请换一个浏览器试试')
    }
  }

  $('save').addEventListener('click', exportPng)
  $('counter').addEventListener('click', function () { save(); toast('已手动保存到本机') })

  /* ============================================================
     全屏
     ============================================================ */
  function toggleFull() {
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen().catch(function () {})
      return
    }
    var el = document.documentElement
    if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () { toast('当前环境不支持全屏') })
    } else {
      toast('当前环境不支持全屏')
    }
  }
  $('full').addEventListener('click', toggleFull)

  /* ============================================================
     快捷键
     ============================================================ */
  document.addEventListener('keydown', function (e) {
    if (!modal.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeModal() }
      return
    }
    var target = e.target
    var tag = target && target.tagName
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
      if (tag !== 'INPUT') return
      if (target.type !== 'range' && target.type !== 'color') return
    }

    var mod = e.metaKey || e.ctrlKey
    var key = (e.key || '').toLowerCase()

    if (mod && key === 'z') {
      e.preventDefault()
      if (e.shiftKey) redo()
      else undo()
      return
    }
    if (mod && key === 'y') { e.preventDefault(); redo(); return }
    if (mod) return

    if (key === 'b') { e.preventDefault(); setTool('pen') }
    else if (key === 'e') { e.preventDefault(); setTool('eraser') }
    else if (key === 'f') { e.preventDefault(); toggleFull() }
    else if (key >= '1' && key <= '4') {
      e.preventDefault()
      var dot = document.querySelectorAll('#swatches .dot[data-color]')[Number(key) - 1]
      if (dot) setColor(dot.getAttribute('data-color'), false)
    }
  })

  /* ============================================================
     尺寸变化
     ============================================================ */
  var rafId = 0
  function relayout() {
    if (rafId) cancelAnimationFrame(rafId)
    rafId = requestAnimationFrame(function () {
      rafId = 0
      if (fitCanvas()) {
        paintPaper()
        redrawInk()
      }
    })
  }

  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(relayout).observe(wrap)
  } else {
    window.addEventListener('resize', relayout)
  }
  window.addEventListener('orientationchange', function () { setTimeout(relayout, 120) })

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') save()
  })
  window.addEventListener('pagehide', save)

  /* ============================================================
     初始化
     ============================================================ */
  function init() {
    var restored = restore()
    setPaper(state.paper)
    setSize(state.size)
    setTool('pen')
    setColor('#1c2333', false)
    fitCanvas()
    paintPaper()
    redrawInk()
    syncButtons()
    if (restored) {
      setStatus('已恢复上次草稿')
      toast('已恢复上次草稿')
    } else {
      setStatus('自动保存已开启')
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true })
  } else {
    init()
  }
})()
</script>
<script data-study-hub-script src="../../assets/hub-nav.js"></script>
</body>
